name: github/workflows/weekly-scrape.yml

on:
  schedule:
    # 10:00 UTC = 06:00 heure Martinique (UTC-4), chaque lundi
    - cron: "0 10 * * 1"
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Lancer le scraper
        run: npm run scrape

      - name: Enregistrer les résultats si changement
        run: |
          git config user.name "offshore-scraper-bot"
          git config user.email "bot@offshorefwi.local"
          git add data/catalogues.json
          git diff --cached --quiet || git commit -m "Scraping hebdomadaire : mise à jour des catalogues détectés"
          git push
