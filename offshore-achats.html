<style>
:root{
  --bg:#0e1117;--bg2:#161b24;--bg3:#1e2535;--bg4:#252d3d;
  --acc:#00e5a0;--acc2:#0099ff;--warn:#ffb83f;--danger:#ff4f6d;
  --text:#e2e8f4;--muted:#7a8aab;--border:rgba(255,255,255,0.07);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:0;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;height:48px}
.tb-logo{padding:0 20px;font-size:15px;font-weight:500;color:var(--acc);letter-spacing:-.3px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;gap:8px;flex-shrink:0}
.tb-logo span{font-size:11px;color:var(--muted);font-weight:300;letter-spacing:1px;text-transform:uppercase}
.tb-tabs{display:flex;height:100%;flex:1;overflow-x:auto}
.tb-tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 18px;font-size:12.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--border);border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s;background:none;border-top:none;border-left:none;font-family:var(--font);height:100%}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--bg)}
.tab .badge{background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;font-family:var(--mono)}
/* MAIN */
.body{flex:1;overflow:hidden;display:flex}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
/* TYPOGRAPHY */
.page-title{font-size:18px;font-weight:500;margin-bottom:3px}
.page-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card-title{font-size:12.5px;font-weight:500;margin-bottom:10px;color:var(--text)}
/* STAT GRID */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg3);border-radius:var(--r);padding:12px 14px}
.stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.stat-val{font-size:22px;font-weight:500;font-family:var(--mono)}
.stat-val.g{color:var(--acc)}.stat-val.b{color:var(--acc2)}.stat-val.a{color:var(--warn)}.stat-val.r{color:var(--danger)}
/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:500;color:var(--muted);background:var(--bg3);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
.sep-row td{background:var(--bg3)!important;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:5px 10px;border-bottom:1px solid var(--border)}
/* FORMS */
.inp{width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--acc)}
.sel{width:100%;padding:7px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none}
.sel option{background:var(--bg3)}
.fl{font-size:10.5px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.col3{grid-template-columns:1fr 1fr 1fr}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:var(--font);transition:all .15s}
.btn:hover{border-color:rgba(255,255,255,0.15);background:var(--bg4)}
.btn.p{background:rgba(0,229,160,0.12);border-color:rgba(0,229,160,0.3);color:var(--acc)}
.btn.p:hover{background:rgba(0,229,160,0.2)}
.btn.d{background:rgba(255,79,109,0.12);border-color:rgba(255,79,109,0.3);color:var(--danger)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:500;font-family:var(--mono)}
.bg{background:rgba(0,229,160,0.12);color:var(--acc)}
.bb{background:rgba(0,153,255,0.12);color:var(--acc2)}
.bo{background:rgba(255,184,63,0.12);color:var(--warn)}
.br{background:rgba(255,79,109,0.12);color:var(--danger)}
.bm{background:var(--bg3);color:var(--muted)}
/* FOURN TAGS */
.ft{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:500;font-family:var(--mono);white-space:nowrap}
.ft-bbs{background:rgba(0,229,160,0.1);color:var(--acc);border:1px solid rgba(0,229,160,0.2)}
.ft-lor{background:rgba(255,79,109,0.1);color:var(--danger);border:1px solid rgba(255,79,109,0.2)}
.ft-sod{background:rgba(255,184,63,0.1);color:var(--warn);border:1px solid rgba(255,184,63,0.2)}
.ft-cap{background:rgba(0,153,255,0.1);color:var(--acc2);border:1px solid rgba(0,153,255,0.2)}
.ft-pap{background:rgba(180,100,255,0.1);color:#b464ff;border:1px solid rgba(180,100,255,0.2)}
.ft-car{background:rgba(100,180,255,0.1);color:#64b4ff;border:1px solid rgba(100,180,255,0.2)}
.ft-cfm{background:rgba(255,140,60,0.1);color:#ff8c3c;border:1px solid rgba(255,140,60,0.2)}
.ft-lec{background:rgba(240,220,60,0.1);color:#e8d43c;border:1px solid rgba(240,220,60,0.2)}
.ft-meg{background:rgba(150,150,150,0.12);color:#aab0bd;border:1px solid rgba(150,150,150,0.2)}
.ft-pcs{background:rgba(255,100,180,0.1);color:#ff64b4;border:1px solid rgba(255,100,180,0.2)}
/* ALERTS */
.al{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r);margin-bottom:8px;font-size:12px;align-items:flex-start}
.al.r{background:rgba(255,79,109,0.08);border:1px solid rgba(255,79,109,0.2)}
.al.a{background:rgba(255,184,63,0.08);border:1px solid rgba(255,184,63,0.2)}
.al.g{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2)}
.al.b{background:rgba(0,153,255,0.08);border:1px solid rgba(0,153,255,0.2)}
.al-ti{font-weight:500;margin-bottom:2px}
.al-tx{font-size:11px;color:var(--muted)}
.al.r .al-ti{color:var(--danger)}.al.a .al-ti{color:var(--warn)}.al.g .al-ti{color:var(--acc)}.al.b .al-ti{color:var(--acc2)}

.cmp-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cmp-lbl{font-size:11.5px;color:var(--muted);width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.cmp-fill{height:100%;border-radius:3px}
.cmp-val{font-size:12px;font-weight:500;font-family:var(--mono);width:120px;flex-shrink:0}
/* AI BOX */
.ai-box{border-left:2px solid var(--acc);padding:10px 14px;background:rgba(0,229,160,0.05);border-radius:0 var(--r) var(--r) 0;font-size:12px;line-height:1.7;margin-top:12px;color:var(--text)}
.ai-lbl{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc);opacity:.7;margin-bottom:6px}
/* UPLOAD */
.upload-zone{border:1.5px dashed rgba(255,255,255,0.12);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;background:var(--bg3);transition:border-color .2s}
.upload-zone:hover{border-color:var(--acc)}
.upload-icon{font-size:32px;margin-bottom:8px;opacity:.4}
/* UNIT TABS */
.ut{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.ut-btn{padding:4px 10px;border-radius:var(--r);font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--muted);font-family:var(--mono)}
.ut-btn.on{background:rgba(0,229,160,0.12);border-color:rgba(0,229,160,0.3);color:var(--acc)}
/* CHIPS */
.chip{display:inline-flex;padding:3px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:11px;cursor:pointer;margin:2px;color:var(--muted)}
.chip:hover,.chip.on{background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.3);color:var(--acc)}
/* DOT */
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.dg{background:var(--acc)}.da{background:var(--warn)}.dr{background:var(--danger)}
/* TOAST */
#toast{position:fixed;bottom:16px;right:16px;background:var(--acc);color:#0e1117;padding:8px 14px;border-radius:var(--r);font-size:12px;font-weight:500;z-index:999;transform:translateY(60px);transition:transform .25s;pointer-events:none}
#toast.show{transform:translateY(0)}
/* MISC */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pri{color:var(--acc);font-weight:500;font-family:var(--mono)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(0,229,160,0.2);border-top-color:var(--acc);border-radius:50%;animation:sp .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .stat-row{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .form-row.col3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .content{padding:14px 12px}
}
</style>
</head>

let STATE = {
  prods: [], page: "produits", catFilter:"all", fournFilter:"all", search:"",
  cmpQ:"", cmpMode:"unite", cmpRes:null, extraRows:[],
  scanType:"catalogue", scanItems:[], scanLoading:false,
  showAdd:false, editId:null, inlineId:null,
  sourcesData:null, sourcesLoading:false, sourcesError:null,
  np:{nom:"",cat:CATS[0],fourn:FOURNS[0],ref:"",unite:"unité",qte:"1",ht:"",ttc:"",note:""},
  newRow:{f:"",p:"",q:"1"},
};

function loadState(){
  try {
    const s = localStorage.getItem("offshore_prods");
    STATE.prods = s ? JSON.parse(s) : JSON.parse(JSON.stringify(INIT_PRODS));
  } catch(e) {
    STATE.prods = JSON.parse(JSON.stringify(INIT_PRODS));
  }
}
function saveProds(){
  try { localStorage.setItem("offshore_prods", JSON.stringify(STATE.prods)); } catch(e){}
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400);
}
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function prixParUnite(prix, qte, mode){
  if(!prix||!qte) return null;
  const m={unite:prix,litre:prix/qte,kg:prix/qte,"100g":prix*100/qte,"100ml":prix*100/qte,portion:prix};
  return (m[mode]||prix);
}
function unitLabel(m){return{unite:"€/u",litre:"€/L",kg:"€/kg","100g":"€/100g","100ml":"€/100mL",portion:"€/port"}[m]||"€";}
function ftCls(f){ return FOURN_CLS[f]||""; }
function fmtHT(v){ return v!=null?v.toFixed(2)+"€":"—"; }
function goPage(p){
  STATE.page=p; STATE.showAdd=false; STATE.inlineId=null;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  const tabs=document.querySelectorAll(".tab");
  const idx={produits:0,scan:1,comparateur:2,alertes:3,sources:4};
  if(tabs[idx[p]]) tabs[idx[p]].classList.add("on");
  updateAlertBadge(); render();
}
function updateAlertBadge(){
  const n=STATE.prods.filter(p=>!p.ht).length;
  const t=document.getElementById("tab-alertes");
  if(t) t.innerHTML=`🔔 Offres & Alertes${n>0?` <span class="badge br">${n}</span>`:""}`;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function render(){
  const app=document.getElementById("app");
  if(!app) return;
  if(STATE.page==="produits") app.innerHTML=renderProduits();
  else if(STATE.page==="scan") app.innerHTML=renderScan();
  else if(STATE.page==="comparateur") app.innerHTML=renderCmp();
  else if(STATE.page==="alertes") app.innerHTML=renderAlertes();
  else if(STATE.page==="sources") app.innerHTML=renderSources();
  bindEvents();
}

        <div><div class="fl">Prix TTC (€)</div><input class="inp" id="np-ttc" type="number" step="0.01" value="${n.ttc}" placeholder="0.00"></div>
        <div><div class="fl">PCB</div><input class="inp" id="np-pcb" type="number" value="${n.pcb||""}" placeholder="6"></div>
      </div>
      <div class="form-row">
        <div><div class="fl">Unité de comparaison</div><select class="sel" id="np-unite">${UNITS.map(u=>`<option${u===n.unite?" selected":""}>${u}</option>`).join("")}</select></div>
        <div><div class="fl">Quantité pour ce prix</div><input class="inp" id="np-qte" type="number" step="0.01" value="${n.qte}" placeholder="1"></div>
      </div>

// ─── PAGE COMPARATEUR ───
function renderCmp(){
  const sugg=["Red Bull","Smirnoff","Piper","GH Martel","Aperol","Campari","Rhum blanc","Heineken","Lorraine","Crevette","Poulpe","Marlin","Saumon","Huile","Burrata","Canard","Vivaneau","Langouste"];
  const modeMap={unite:"à l'unité",litre:"au litre",kg:"au kg","100g":"aux 100g","100ml":"aux 100mL"};

  let bars="";
  let aiBox="";
  if(STATE.cmpRes){
    const allRows=[...STATE.cmpRes.rows,...STATE.extraRows];
    const vals=allRows.map(r=>prixParUnite(r.p,r.q,STATE.cmpMode));
    const mx=Math.max(...vals), mn=Math.min(...vals);
    const lbl=unitLabel(STATE.cmpMode);
    bars=allRows.map((r,i)=>{
      const v=vals[i];
      const pct=10+((v-mn)/(mx-mn+0.01))*65;
      const isBest=v===mn; const isWorst=v===mx;
      const col=isBest?"var(--acc)":isWorst?"var(--danger)":"var(--acc2)";
      return `<div class="cmp-bar">
        <span class="cmp-lbl">${esc(r.f)}</span>
        <div class="cmp-track"><div class="cmp-fill" style="width:${pct}%;background:${col}"></div></div>
        <span class="cmp-val" style="color:${col}">${v.toFixed(2)}${lbl}${isBest?` <span class="badge bg" style="font-size:9px">✓ moins cher</span>`:""}</span>
      </div>`;
    }).join("");
    if(mn<mx){
      const bestF=allRows[vals.indexOf(mn)].f;
      const eco=((mx-mn)/mx*100).toFixed(0);
      aiBox=`<div class="ai-box">
        <div class="ai-lbl">Recommandation</div>
        Moins cher : <strong>${esc(bestF)}</strong> à <strong>${mn.toFixed(2)}${lbl}</strong>.
        Économie vs le plus cher : <strong>${eco}%</strong>.
      </div>`;
    }
  }

  return `<div class="page-title">Comparateur de prix ⚖️</div>
  <div class="page-sub">Comparez à l'unité · au litre · au kg · aux 100g · aux 100mL</div>
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input class="inp" id="cmp-inp" value="${esc(STATE.cmpQ)}" placeholder="Nom d'un produit ou mot-clé…" oninput="STATE.cmpQ=this.value" onkeydown="if(event.key==='Enter')runCmp()" style="flex:1">
      <button class="btn p" onclick="runCmp()">Comparer</button>
    </div>
    <div style="margin-bottom:12px">${sugg.map(s=>`<span class="chip" onclick="STATE.cmpQ='${s}';STATE.extraRows=[];runCmp()">${s}</span>`).join("")}</div>
    <div class="ut">${Object.entries(modeMap).map(([m,l])=>`<button class="ut-btn${STATE.cmpMode===m?" on":""}" onclick="STATE.cmpMode='${m}';if(STATE.cmpRes)runCmp()">${l}</button>`).join("")}</div>
  </div>
  ${STATE.cmpRes?`<div class="card">
    <div class="card-title" style="margin-bottom:12px">${esc(STATE.cmpRes.n)} — comparaison ${modeMap[STATE.cmpMode]}</div>
    ${bars}
    ${aiBox}
  </div>
  <div class="card">
    <div class="card-title">+ Ajouter un prix vu ailleurs</div>
    <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
      <div style="flex:1.5;min-width:120px"><div class="fl">Enseigne / fournisseur</div><input class="inp" id="nr-f" value="${esc(STATE.newRow.f)}" placeholder="Ex: Leclerc"></div>
      <div style="width:100px"><div class="fl">Prix HT (€)</div><input class="inp" id="nr-p" type="number" step="0.01" value="${STATE.newRow.p}" placeholder="0.00"></div>
      <div style="width:90px"><div class="fl">Qté (L/kg/u)</div><input class="inp" id="nr-q" type="number" step="0.01" value="${STATE.newRow.q}" placeholder="1"></div>
      <button class="btn p" onclick="addExtraRow()">Ajouter</button>
    </div>
    ${STATE.extraRows.length>0?`<div style="margin-top:8px;font-size:11px;color:var(--muted)">${STATE.extraRows.length} prix ajouté(s) manuellement <button class="btn sm" onclick="STATE.extraRows=[];runCmp()" style="margin-left:8px">Effacer</button></div>`:""}
  </div>`:
  `<div class="ai-box">
    <div class="ai-lbl">Comment utiliser</div>
    Cliquez sur une suggestion ou tapez un mot-clé, puis choisissez l'unité de comparaison (litre, kg, 100g…).
    Tous vos fournisseurs sont comparés. Ajoutez manuellement un prix vu en promo pour l'inclure dans la comparaison.
  </div>`}`;
}

  return `<div class="page-title">Sources surveillées 🔎</div>
  <div class="page-sub">Dernier scraping : ${genDate} · ${totalNouveaux} nouveau(x) catalogue(s) détecté(s)</div>

      ${s.note?`<div style="font-size:11px;color:var(--muted);margin-bottom:8px">${esc(s.note)}</div>`:""}
      ${s.erreur?`<div style="font-size:11px;color:var(--danger);margin-bottom:8px">Erreur : ${esc(s.erreur)}</div>`:""}

          </div>
          <a href="${esc(c.lien)}" target="_blank" class="btn sm">Feuilleter →</a>
        </div>`).join(""):""}
    </div>`).join("")}

}
async function fetchSources(){
  STATE.sourcesLoading=true; STATE.sourcesError=null; render();
  try{
    const r=await fetch(SOURCES_FEED_URL+"?t="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    STATE.sourcesData=await r.json();
    const n=(STATE.sourcesData.sources||[]).reduce((a,s)=>a+(s.catalogues||[]).filter(c=>c.nouveau).length,0);
    const t=document.getElementById("tab-sources");
    if(t) t.innerHTML=`🔎 Sources surveillées${n>0?` <span class="badge br">${n}</span>`:""}`;
  }catch(e){
    STATE.sourcesError=e.message;
  }
  STATE.sourcesLoading=false; render();
}

// SCAN
async function handleScan(files){
  if(!files||!files[0]) return;
  const f=files[0];
  STATE.scanLoading=true; STATE.scanItems=[]; render();
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    const b64=ev.target.result.split(",")[1];
    const mt=f.type||"image/jpeg";
    const prompt=STATE.scanType==="catalogue"
      ?`Analyse ce catalogue fournisseur pour un restaurant en Martinique. Extrais TOUS les produits visibles avec leur prix HT. Réponds UNIQUEMENT avec un tableau JSON valide, sans texte avant ni après, sans balises markdown : [{"produit":"nom complet","ref":"référence si visible","prix":0.00,"unite":"unité/litre/kg selon le produit","format":"ex:75cl ou 5kg","fourn":"fournisseur si visible","note":"offre promo si mentionnée"}]`
      :`Analyse cette facture fournisseur. Extrais chaque ligne produit avec prix unitaire HT. Réponds UNIQUEMENT avec un tableau JSON valide, sans texte avant ni après, sans balises markdown : [{"produit":"nom","ref":"référence","qte":1,"prixUnit":0.00,"total":0.00,"fourn":"fournisseur","note":""}]`;
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:3000,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:mt,data:b64}},
            {type:"text",text:prompt}
          ]}]
        })
      });
      const d=await r.json();
      const raw=(d.content?.[0]?.text||"[]").replace(/```json|```/g,"").trim();
      const items=JSON.parse(raw);
      STATE.scanItems=items;
      toast(items.length+" produits extraits ✓");
    }catch(e){
      STATE.scanItems=[{produit:"Erreur d'analyse — vérifiez que l'image est lisible et réessayez",prix:0}];
    }
    STATE.scanLoading=false; render();
  };
  reader.readAsDataURL(f);
}
function importScan(i){
  const it=STATE.scanItems[i]; if(!it) return;
  const nom=(it.produit||"").substring(0,60);
  const prix=it.prixUnit||it.prix||0;
  const fourn=it.fourn||"Autre";
  const ref=it.ref||null;
  const note=it.note||it.format||"";
  const match=STATE.prods.find(p=>p.nom.toLowerCase().split(" ").filter(w=>w.length>3).some(w=>nom.toLowerCase().includes(w)));
  if(match){
    STATE.prods=STATE.prods.map(p=>p.id===match.id?{...p,ht:prix||p.ht,fourn:fourn||p.fourn,ref:ref||p.ref,note:note||p.note}:p);
    toast("Prix mis à jour : "+match.nom.substring(0,30));
  } else {
    STATE.prods=[...STATE.prods,{id:Date.now(),nom,cat:"Épicerie",fourn,ref,unite:"unité",qte:1,ht:prix||null,ttc:null,tva:null,pcb:null,note}];
    toast("Ajouté : "+nom.substring(0,30));
  }
  saveProds(); updateAlertBadge();
}
function importAll(){
  for(let i=0;i<STATE.scanItems.length;i++) importScan(i);
  toast(`${STATE.scanItems.length} produits importés ✓`);
}

// COMPARATEUR
function runCmp(){
  const v=(STATE.cmpQ||"").toLowerCase().trim();
  if(!v) return;
  let found=null;
  for(const[k,d]of Object.entries(CMP_DB)){
    if(v.includes(k.split(" ")[0])||k.split(" ").some(w=>w.length>3&&v.includes(w))){found={...d,rows:[...d.rows]};break;}
  }
  if(!found){
    const p=STATE.prods.find(x=>x.ht&&x.nom.toLowerCase().includes(v));
    if(p)found={n:p.nom,u:p.unite,rows:[{f:p.fourn,p:p.ht,q:p.qte},{f:"Alternative +18%",p:p.ht*1.18,q:p.qte},{f:"GMS estimé +38%",p:p.ht*1.38,q:p.qte}]};
  }
  if(!found){toast("Produit non trouvé — essayez un autre mot-clé");return;}
  if(STATE.extraRows.length) found={...found,rows:[...found.rows,...STATE.extraRows]};
  STATE.cmpRes=found; render();
}
function addExtraRow(){
  const f=document.getElementById("nr-f")?.value?.trim();
  const p=parseFloat(document.getElementById("nr-p")?.value);
  const q=parseFloat(document.getElementById("nr-q")?.value)||1;
  if(!f||!p){toast("Renseignez fournisseur et prix");return;}
  STATE.extraRows=[...STATE.extraRows,{f,p,q}];
  STATE.newRow={f:"",p:"",q:"1"};
  runCmp();
}

// EVENTS
function bindEvents(){}

loadState();
updateAlertBadge();
render();
fetchSources();
</script>
